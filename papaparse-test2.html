<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PapaParse Custom Parser</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    textarea { width: 100%; height: 160px; font-family: monospace; margin-bottom: 1rem; }
    select, button { padding: 0.4rem 0.6rem; margin-right: 0.5rem; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>PapaParse Custom Parser</h2>

  <p>Paste your data below:</p>
  <textarea id="inputField">aaa
bbb
ccc	111
222
333;aaa "bbb" ccc "ddd"	"111" 222 "333" 444;</textarea><br>

  <label>Row separator:
    <select id="rowSep">
      <option value="newline" selected>Newline (\n)</option>
      <option value="semicolon">Semicolon (;)</option>
    </select>
  </label>

  <label>Field separator:
    <select id="colSep">
      <option value="tab" selected>Tab (↹)</option>
      <option value="semicolon">Semicolon (;)</option>
      <option value="comma">Comma (,)</option>
    </select>
  </label>

  <button id="parseBtn">Parse with PapaParse</button>

  <h3>Parsed Output:</h3>
  <pre id="output"></pre>

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    function preprocess(input, rowSepChoice) {
      let text = input;

      // Neutralize quotes so PapaParse doesn't treat them as special
      text = text.replace(/"/g, "§§QUOTE§§");

      // Force row separator
      if (rowSepChoice === "semicolon") {
        // Replace newlines with placeholder
        text = text.replace(/\r\n/g, "§§CRLF§§");
        text = text.replace(/\r/g, "§§CR§§");
        text = text.replace(/\n/g, "§§LF§§");
        // Replace semicolons with real newlines
        text = text.replace(/;/g, "\n");
      }
      return text;
    }

    function postprocess(data) {
      // Restore quotes
      data = data.map(row =>
        row.map(field =>
          typeof field === "string" ? field.replace(/§§QUOTE§§/g, '"') : field
        )
      );
      console.log('1');
      console.log(data);
      // Restore CRLF
      data = data.map(row =>
        row.map(field =>
          typeof field === "string" ? field.replace(/§§CRLF§§/g, '\r\n') : field
        )
      );
      console.log('2');
      console.log(data);
      // Restore CR
      data = data.map(row =>
        row.map(field =>
          typeof field === "string" ? field.replace(/§§CR§§/g, '\r') : field
        )
      );
      console.log('3');
      console.log(data);
      // Restore LF
      data = data.map(row =>
        row.map(field =>
          typeof field === "string" ? field.replace(/§§LF§§/g, '\n') : field
        )
      );
      console.log('4');
      console.log(data);
      return data;
    }

    document.getElementById("parseBtn").addEventListener("click", () => {
      const input = document.getElementById("inputField").value;
      const rowSep = document.getElementById("rowSep").value;
      const colSep = document.getElementById("colSep").value;

      const delimiter = colSep === "tab" ? "\t" :
                        colSep === "semicolon" ? ";" : ",";

      const pre = preprocess(input, rowSep);

      const result = Papa.parse(pre, {
        delimiter: delimiter,
        quoteChar: "\u0000", // impossible char → disables quote parsing
        skipEmptyLines: true
      });

      const post = postprocess(result.data);

      // Pretty display
      let display = "";
      post.forEach((row, ri) => {
        row.forEach((col, ci) => {
          display += `row ${ri+1}, column ${ci+1}:\n${col}\n\n`;
        });
      });

      document.getElementById("output").textContent = display;
      console.log("PapaParse raw result:", result);
      console.log("Postprocessed result:", post);
    });
  </script>
</body>
</html>
