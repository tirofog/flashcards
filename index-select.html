<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards: CSV to PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    input, button, label, select, textarea {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
    }
    textarea {
      height: 150px;
      resize: vertical;
    }
    button {
      background-color: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Flashcards: CSV to PDF</h1>

    <label for="csvFile">Upload your CSV file:</label>
    <input type="file" id="csvFile" accept=".csv">

    <label for="csvText">Or paste your CSV content (e.g. from Quizlet export) here:</label>
    <textarea id="csvText" placeholder="e.g., een baviaan,a baboon&#10;een jachtluipaard,a cheetah&#10;een chimpansee,a chimpanzee&#10;een hert,a deer"></textarea>

    <label for="fontSize">Select Font Size:</label>
    <select id="fontSize">
      <option value="10">10</option>
      <option value="12">12</option>
      <option value="14">14</option>
      <option value="16" selected>16</option>
      <option value="18">18</option>
      <option value="20">20</option>
      <option value="22">22</option>
      <option value="24">24</option>
    </select>

    <label for="delimiter">Select CSV delimiter</label>
    <select id="delimiter">
      <option value="\t" selected>Tab</option>
      <option value=",">Comma</option>
      <option value=";">Semicolon</option>
    </select>

    <label for="color1">Select Font Color for flashcard front:</label>
    <!--<input type="color" id="color1" value="#000000">-->
    <select id="color1">
      <option value="#000000">Black</option>
      <option value="#FF0000">Red</option>
      <option value="#0000FF" selected>Blue</option>
      <option value="#008000">Green</option>
      <option value="#FFA500">Orange</option>
    </select>

    <label for="color2">Select Font Color for flashcard back:</label>
    <!--<input type="color" id="color2" value="#000000">-->
    <select id="color2">
      <option value="#000000" selected>Black</option>
      <option value="#FF0000">Red</option>
      <option value="#0000FF">Blue</option>
      <option value="#008000">Green</option>
      <option value="#FFA500">Orange</option>
    </select>

    <label for="filename">Specify PDF Filename (optional):</label>
    <input type="text" id="filename" placeholder="Enter filename without extension">

    <label>
      <input type="checkbox" id="doubleSided" checked>
      Generate as double-sided flashcards (front & back on alternating pages)
    </label>

    <label for="chapterLabel">Card Set label (optional):</label>
    <input type="text" id="chapterLabel" placeholder="e.g. Chapter 3 - Fractions">
    
    <button id="generatePdf">Convert to PDF</button>
  </div>

  <script>
    document.getElementById('generatePdf').addEventListener('click', () => {
      const fileInput = document.getElementById('csvFile');
      const csvText = document.getElementById('csvText').value.trim();
      const isDoubleSided = document.getElementById('doubleSided').checked;

      if (!fileInput.files.length && !csvText) {
        alert('Please upload a CSV file or paste CSV content.');
        return;
      }

      const parseOptions = {
        delimiter: document.getElementById('delimiter').value,
        skipEmptyLines: true,
        complete: (results) => {
          const data = results.data;
          if (!validateCsvData(data)) return;
          if (isDoubleSided) {
            generatePDF_DoubleSided(data);
          } else {
            generatePDF_SingleSided(data);
          }
        },
        error: () => alert('Error reading CSV file.')
      };

      if (fileInput.files.length) {
        Papa.parse(fileInput.files[0], parseOptions);
      } else {
        const data = Papa.parse(csvText, parseOptions).data;
        if (!validateCsvData(data)) return;
        if (isDoubleSided) {
          generatePDF_DoubleSided(data);
        } else {
          generatePDF_SingleSided(data);
        }
      }
    });
    
    function validateCsvData(data) {
      if (data.length < 2 || data[0].length !== 2) {
        alert('The CSV data must have exactly two columns.');
        return false;
      }
      return true;
    }

function generatePDF_DoubleSided(data) {
  const { jsPDF } = window.jspdf;

  const pageWidth = 297, pageHeight = 210, pageMargin = 0, cellMargin = 5;
  const usablePageWidth = pageWidth - 2 * pageMargin;
  const usablePageHeight = pageHeight - 2 * pageMargin;
  const columnWidth = usablePageWidth / 4;
  const rowHeight = usablePageHeight / 4;

  const fontSize = parseInt(document.getElementById('fontSize').value);
  const color1 = document.getElementById('color1').value;
  const color2 = document.getElementById('color2').value;

  const filenameInput = document.getElementById('filename').value.trim();
  const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
  const filename = filenameInput || `flashcards-${timestamp}.pdf`;

  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'l' });

  for (let i = 0; i < data.length; i += 16) {
    const chunk = data.slice(i, i + 16);
    const front = [], back = [];

    for (let row = 0; row < 4; row++) {
      const frontRow = [], backRow = [];
      for (let col = 0; col < 4; col++) {
        const index = row * 4 + col;
        frontRow.push(chunk[index]?.[0] || "");
        backRow.unshift(chunk[index]?.[1] || "");
      }
      front.push(frontRow);
      back.push(backRow);
    }

    pdf.autoTable({
      body: front.map((row, rowIndex) =>
        row.map((cellText, colIndex) => {
          return {
            content: cellText,
            styles: {
              valign: 'top',
              halign: 'center'
            },
            didDrawCell: function (data) {
              const chapterLabel = document.getElementById('chapterLabel').value.trim();
              if (chapterLabel) {
                const { cell } = data;
                pdf.setFontSize(fontSize - 3);
                pdf.setTextColor(color1);
                pdf.text(
                  chapterLabel,
                  cell.x + cell.width - 2,
                  cell.y + cell.height - 2,
                  { align: 'right' }
                );
                pdf.setFontSize(fontSize); // Reset font size
              }
            }
          };
        })
      ),
      startY: pageMargin,
      theme: 'grid',
      styles: {
        halign: 'center', valign: 'middle',
        fontSize: fontSize, cellPadding: cellMargin,
        lineColor: 0, textColor: color1, overflow: 'linebreak'
      },
      columnStyles: { 0: { cellWidth: columnWidth }, 1: {}, 2: {}, 3: {} },
      bodyStyles: { minCellHeight: rowHeight },
      margin: { top: pageMargin, left: pageMargin, right: pageMargin, bottom: pageMargin }
    });

    pdf.addPage();

    pdf.autoTable({
      body: back,
      startY: pageMargin,
      theme: 'grid',
      styles: {
        halign: 'center', valign: 'middle',
        fontSize: fontSize, cellPadding: cellMargin,
        lineColor: 0, textColor: color2, overflow: 'linebreak'
      },
      columnStyles: { 0: { cellWidth: columnWidth }, 1: {}, 2: {}, 3: {} },
      bodyStyles: { minCellHeight: rowHeight },
      margin: { top: pageMargin, left: pageMargin, right: pageMargin, bottom: pageMargin }
    });

    if (i + 16 < data.length) pdf.addPage();
  }

  pdf.save(filename);
}

function generatePDF_SingleSided(data) {
  const { jsPDF } = window.jspdf;

  const pageWidth = 297; // A4 landscape
  const pageHeight = 210;
  const cellMargin = 5;
  const fontSize = parseInt(document.getElementById('fontSize').value);
  const color1 = document.getElementById('color1').value;
  const color2 = document.getElementById('color2').value;
  const chapterLabel = document.getElementById('chapterLabel').value.trim();
  const filenameInput = document.getElementById('filename').value.trim();
  const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
  const filename = filenameInput || `flashcards-${timestamp}.pdf`;

  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'l' });

  // Create front/back card pairs
  let tableData = [];
  for (let i = 0; i < data.length; i++) {
    const front = data[i][0] || '';
    const back = data[i][1] || '';
    tableData.push([front, back]);
  }

  // Build rows of format: f1, b1, f2, b2
  const rows = [];
  for (let i = 0; i < tableData.length; i += 2) {
    const row = [
      tableData[i]?.[0] || '',  // f1
      tableData[i]?.[1] || '',  // b1
      tableData[i + 1]?.[0] || '',  // f2
      tableData[i + 1]?.[1] || ''   // b2
    ];
    rows.push(row);
  }

  // Each page holds 4 rows (8 cards = 4 fronts + 4 backs)
  for (let pageIndex = 0; pageIndex < rows.length; pageIndex += 4) {
    if (pageIndex > 0) pdf.addPage();

    const chunk = rows.slice(pageIndex, pageIndex + 4);

    pdf.autoTable({
      body: chunk.map(row =>
        row.map((text, colIdx) => ({
          content: text,
          styles: {
            fontSize,
            valign: 'middle',
            halign: 'center',
            textColor: colIdx % 2 === 0 ? color1 : color2
          },
          didDrawCell: function (data) {
            if (colIdx % 2 === 0 && chapterLabel) {
              const { cell } = data;
              pdf.setFontSize(fontSize - 3);
              pdf.setTextColor(color1);
              pdf.text(
                chapterLabel,
                cell.x + cell.width - 2,
                cell.y + cell.height - 2,
                { align: 'right' }
              );
              pdf.setFontSize(fontSize);
            }
          }
        }))
      ),
      startY: 0,
      theme: 'grid',
      styles: {
        cellPadding: cellMargin,
        minCellHeight: (pageHeight / 4),
        overflow: 'linebreak',
      },
      columnStyles: {
        0: { cellWidth: pageWidth / 4 },
        1: { cellWidth: pageWidth / 4 },
        2: { cellWidth: pageWidth / 4 },
        3: { cellWidth: pageWidth / 4 }
      },
      margin: { top: 0, left: 0, right: 0, bottom: 0 },
    });
  }

  pdf.save(filename);
}

function generatePDF(data) {
  const { jsPDF } = window.jspdf;

  const pageWidth = 297;
  const pageHeight = 210;
  const pageMargin = 0;
  const cellMargin = 5;
  const usablePageWidth = pageWidth - 2 * pageMargin;
  const usablePageHeight = pageHeight - 2 * pageMargin;
  const columnWidth = usablePageWidth / 4;
  const rowHeight = usablePageHeight / 4;

  const fontSize = parseInt(document.getElementById('fontSize').value);
  const color1 = document.getElementById('color1').value;
  const color2 = document.getElementById('color2').value;

  const filenameInput = document.getElementById('filename').value.trim();
  const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
  const filename = filenameInput || `flashcards-${timestamp}.pdf`;

  const pdf = new jsPDF({
    unit: 'mm',
    format: 'a4',
    orientation: 'l'
  });

  const chunkSize = 16;
  for (let i = 0; i < data.length; i += chunkSize) {
    const chunk = data.slice(i, i + chunkSize);

    const front = [];
    const back = [];

    for (let row = 0; row < 4; row++) {
      const frontRow = [];
      const backRow = [];
      for (let col = 0; col < 4; col++) {
        const index = row * 4 + col;
        frontRow.push(chunk[index]?.[0] || "");                          // Front: term
        backRow.unshift(chunk[index]?.[1] || ""); // Back: mirrored answers
      }
      front.push(frontRow);
      back.push(backRow);
    }

    // Page 1: front side
    pdf.autoTable({
      body: front,
      startY: pageMargin,
      theme: 'grid',
      styles: {
        halign: 'center',
        valign: 'middle',
        fontSize: fontSize,
        cellPadding: cellMargin,
        lineColor: 0,
        textColor: color1,
        overflow: 'linebreak'
      },
      columnStyles: {
        0: { cellWidth: columnWidth },
        1: { cellWidth: columnWidth },
        2: { cellWidth: columnWidth },
        3: { cellWidth: columnWidth }
      },
      bodyStyles: {
        minCellHeight: rowHeight
      },
      margin: { top: pageMargin, left: pageMargin, right: pageMargin, bottom: pageMargin }
    });

    pdf.addPage();

    // Page 2: back side
    pdf.autoTable({
      body: back,
      startY: pageMargin,
      theme: 'grid',
      styles: {
        halign: 'center',
        valign: 'middle',
        fontSize: fontSize,
        cellPadding: cellMargin,
        lineColor: 0,
        textColor: color2,
        overflow: 'linebreak'
      },
      columnStyles: {
        0: { cellWidth: columnWidth },
        1: { cellWidth: columnWidth },
        2: { cellWidth: columnWidth },
        3: { cellWidth: columnWidth }
      },
      bodyStyles: {
        minCellHeight: rowHeight
      },
      margin: { top: pageMargin, left: pageMargin, right: pageMargin, bottom: pageMargin }
    });

    // No extra page break needed unless more cards
    if (i + chunkSize < data.length) {
      pdf.addPage();
    }
  }

  pdf.save(filename);
}
</script>
</body>
</html>
